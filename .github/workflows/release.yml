name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: composer lint

      - name: Run unit tests
        run: composer test:unit

      - name: Verify tag matches plugin version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          PHP_VERSION="$(grep -m1 'Version:' tagbridge.php | awk '{print $NF}')"
          STABLE_TAG="$(grep -m1 '^Stable tag:' readme.txt | awk '{print $NF}')"
          if [ "${PHP_VERSION}" != "${VERSION}" ] || [ "${STABLE_TAG}" != "${VERSION}" ]; then
            echo "Version mismatch: tag=${VERSION} tagbridge.php=${PHP_VERSION} readme.txt=${STABLE_TAG}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG_NAME=${TAG_NAME}" >> "${GITHUB_ENV}"

      - name: Build release ZIP
        run: bash bin/build-zip.sh

      - name: Generate release notes
        run: |
          CHANGELOG="$(awk -v ver="${VERSION}" '
            $0 == "= " ver " =" { in_sec = 1; next }
            in_sec && /^=/ { exit }
            in_sec { print }
          ' readme.txt)"
          if [ -z "${CHANGELOG//[[:space:]]/}" ]; then
            echo "No changelog entry found for ${VERSION} in readme.txt" >&2
            exit 1
          fi
          REQ_PHP="$(grep -m1 '^Requires PHP:' readme.txt | awk '{print $NF}')"
          REQ_WP="$(grep -m1 '^Requires at least:' readme.txt | awk '{print $NF}')"
          TESTED_WP="$(grep -m1 '^Tested up to:' readme.txt | awk '{print $NF}')"
          cat > /tmp/release-notes.md <<EOF
          Modular integration platform for WordPress, starting with a deep, independent integration for PostHog. Not affiliated with PostHog.

          Install: download \`tagbridge.zip\` below and upload it via Plugins -> Add New -> Upload Plugin (or install directly from WordPress.org).

          ### What's New in ${VERSION}

          ${CHANGELOG}

          Requires PHP ${REQ_PHP:-8.2}+ and WordPress ${REQ_WP:-5.8}+. WooCommerce optional. Tested up to WordPress ${TESTED_WP:-7.0}.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "Tagbridge ${VERSION}" --notes-file /tmp/release-notes.md
            gh release upload "${TAG_NAME}" dist/tagbridge.zip --clobber
          else
            gh release create "${TAG_NAME}" dist/tagbridge.zip --title "Tagbridge ${VERSION}" --notes-file /tmp/release-notes.md
          fi
